<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DAG — Monitor de batería</title>

  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1: #071027;
      --bg-2: #07263a;
      --card-border: rgba(255,255,255,0.06);
      --muted: rgba(230,246,255,0.8);
      --accent-teal: #00bcd4;
      --accent-indigo: #5b6cff;
      --accent-violet: #7e57c2;
      --warning: #f9a825;
      --danger: #ff5252;
      --glass-shadow: 0 10px 30px rgba(2,6,23,0.65);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: #eaf6ff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap { max-width:1100px; margin:36px auto; padding:20px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap: wrap; }
    header h1{ margin:0; font-weight:600; font-size:1.2rem }
    header .small { color:var(--muted); font-size:0.95rem }

    .container { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid var(--card-border);
      box-shadow: var(--glass-shadow);
      padding:18px;
      border-radius:12px;
      color: #eaf6ff;
    }

    .left { flex:1 1 640px; min-width:300px }
    .right { width:320px; display:flex; flex-direction:column; gap:14px; min-width:260px; align-items:center }

    .chart-wrap { position:relative; height:360px; border-radius:10px; overflow:hidden; }
    canvas { width:100%; height:100%; display:block; border-radius:8px; background: linear-gradient(180deg, rgba(0,0,0,0.10), rgba(255,255,255,0.02)); padding:8px; }

    /* Overlay cuando no hay batería */
    .overlay {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background: linear-gradient(180deg, rgba(3,10,20,0.68), rgba(3,10,20,0.68));
      color: rgba(230,246,255,0.95); font-weight:700; font-size:1.05rem; text-align:center;
      padding:14px; gap:8px; flex-direction:column;
    }
    .overlay.small { font-weight:500; font-size:0.95rem; color:var(--muted) }

    .controls { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap }
    button {
      border: none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600;
      color: #042435; background: linear-gradient(180deg, var(--accent-teal), var(--accent-indigo));
      box-shadow: 0 6px 18px rgba(11,28,40,0.45), inset 0 -3px 6px rgba(255,255,255,0.03);
    }
    .btn-muted { background: transparent; color: var(--muted); border:1px solid rgba(255,255,255,0.04); box-shadow:none; }
    .btn-secondary { background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); color: #dff6ff; border:1px solid rgba(255,255,255,0.04); }

    .small { font-size:0.9rem; color:var(--muted) }

    /* Batería */
    .battery-wrap { width:240px; text-align:center; padding:12px; }
    svg { display:block; margin:0 auto; }
    #batFill{ transition: width 700ms cubic-bezier(.2,.9,.2,1), fill 500ms ease; transform-origin: left center; }
    #batText { transition: fill 300ms ease; font-family: "Inter", sans-serif; }

    .battery-stats { text-align:center; color:#dff6ff; font-weight:600; }
    .stat-small { font-weight:400; color:var(--muted); font-size:0.92rem; margin-top:4px }

    .badge { padding:6px 10px; border-radius:8px; font-weight:700; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.03); color:var(--muted) }

    /* Voltaje y Batería Info */
    .info-cards {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      width: 100%;
    }

    .info-card {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .info-card .label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .info-card .value {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-teal);
    }

    /* Toast/Alert */
    #alertBar { display:none; position:fixed; right:20px; bottom:20px; padding:12px 16px; border-radius:10px; color:#042435; font-weight:700; box-shadow:0 10px 30px rgba(2,6,23,0.6); z-index: 999; }
    #alertBar.warn { background: var(--warning); }
    #alertBar.crit { background: var(--danger); color:#fff; }

    /* Firebase Status */
    .status-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9aa7b8;
    }

    .status-dot.connected {
      background: #4fd1c5;
      box-shadow: 0 0 8px #4fd1c5;
    }

    .status-dot.error {
      background: #ff5252;
      box-shadow: 0 0 8px #ff5252;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1><img src="Logotipo oscuro.xcf" alt="DAG"></h1>
        <div class="small"> DAG — monitor de batería</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="status-bar">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">Desconectado</span>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="card left">
        <div class="chart-wrap">
          <canvas id="energyChart"></canvas>
          <div id="noBatteryOverlay" class="overlay" style="display:flex">
            <div>No se detecta conexión a Firebase</div>
            <div class="small">Conectando a datos del Arduino...</div>
          </div>
        </div>

        <div class="controls" style="margin-top:12px">
          <button id="pauseBtn" disabled>Pausar monitoreo</button>
          <button id="clearBtn" class="btn-muted">Limpiar gráfico</button>
          <button id="simulateBtn" class="btn-secondary">Simular datos</button>

          <div style="margin-left:auto; text-align:right">
            <div class="small">Última actualización</div>
            <div id="lastUpdate" style="font-weight:700">—</div>
          </div>
        </div>

        <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <label class="small" style="display:flex;gap:8px;align-items:center">
            <input id="persistCb" type="checkbox" checked /> Guardar historial localmente
          </label>
          <label class="small" style="display:flex;gap:8px;align-items:center;margin-left:6px">
            <input id="clearOnDisconnectCb" type="checkbox" /> Borrar historial al desconectar
          </label>
        </div>

        <div class="legend" style="margin-top:12px; color:var(--muted); font-size:0.9rem">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:12px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--accent-teal),var(--accent-indigo))"></span> Porcentaje de batería
          </span>
          <span style="margin-left:14px; display:flex;align-items:center;gap:8px">
            <span style="width:12px;height:12px;border-radius:6px;background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.04)"></span> Voltaje (V)
          </span>
        </div>
      </div>

      <div class="card right">
        <div class="battery-wrap">
          <svg id="batterySvg" viewBox="0 0 140 70" width="240" height="120" aria-label="Nivel de batería">
            <rect x="126" y="22" width="8" height="26" rx="2" ry="2" fill="#e1f8ff" opacity="0.08" />
            <rect x="6" y="8" width="116" height="54" rx="9" ry="9" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
            <rect x="9" y="11" width="110" height="48" rx="7" ry="7" fill="rgba(255,255,255,0.02)" />
            <clipPath id="batClip"><rect id="batInnerClip" x="9" y="11" width="110" height="48" rx="7" ry="7" /></clipPath>

            <rect id="batFill" x="9" y="11" width="0" height="48" rx="7" ry="7" clip-path="url(#batClip)" fill="url(#gradFill)"></rect>

            <defs>
              <linearGradient id="gradFill" x1="0" x2="1">
                <stop offset="0%" stop-color="#00bcd4"/>
                <stop offset="100%" stop-color="#5b6cff"/>
              </linearGradient>
            </defs>

            <text id="batText" x="64" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#e6f9ff">--%</text>
          </svg>
        </div>

        <div class="battery-stats">
          <div>Batería: <span id="percentLabel">--%</span></div>
          <div class="stat-small">Voltaje: <span id="voltageLabel">-- V</span></div>
        </div>

        <div class="info-cards">
          <div class="info-card">
            <div class="label">Batería</div>
            <div class="value" id="batteryValueCard">--%</div>
          </div>
          <div class="info-card">
            <div class="label">Voltaje</div>
            <div class="value" id="voltageValueCard">-- V</div>
          </div>
        </div>

        <div style="width:100%; display:flex; flex-direction:column; gap:8px; align-items:center; margin-top: 12px;">
          <div class="small" style="text-align:center; opacity:0.95">Umbrales: <span class="badge">Aviso &lt;20%</span> <span class="badge">Crítico &lt;10%</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="alertBar"></div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    /*****************************************************************
     * Configuración Firebase - Usando tus credenciales
     *****************************************************************/
    const firebaseConfig = {
      apiKey: "AIzaSyAaajV8M_4CAADuPpaF7uzYW7lAqTpc5vE",
      authDomain: "dag-page.firebaseapp.com",
      databaseURL: "https://dag-page-default-rtdb.firebaseio.com",
      projectId: "dag-page",
      storageBucket: "dag-page.firebasestorage.app",
      messagingSenderId: "334648708303",
      appId: "1:334648708303:web:891f0ebe6c41e84f8dbbba",
      measurementId: "G-W5ELGYYKXH"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    /*****************************************************************
     * Estado Global
     *****************************************************************/
    let batteryDetected = false;
    let currentBattery = 0;
    let currentVoltage = 0;
    let consecutiveFailures = 0;

    // Gráfico - almacenará ambos datasets
    const labels = [];
    const batteryData = [];
    const voltageData = [];

    // UI refs
    const overlay = document.getElementById('noBatteryOverlay');
    const pauseBtn = document.getElementById('pauseBtn');
    const clearBtn = document.getElementById('clearBtn');
    const simulateBtn = document.getElementById('simulateBtn');
    const lastUpdateEl = document.getElementById('lastUpdate');
    const percentLabel = document.getElementById('percentLabel');
    const voltageLabel = document.getElementById('voltageLabel');
    const batteryValueCard = document.getElementById('batteryValueCard');
    const voltageValueCard = document.getElementById('voltageValueCard');
    const batFill = document.getElementById('batFill');
    const batText = document.getElementById('batText');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const alertBar = document.getElementById('alertBar');
    const persistCb = document.getElementById('persistCb');
    const clearOnDisconnectCb = document.getElementById('clearOnDisconnectCb');

    /*****************************************************************
     * Chart.js setup - Dos series (Batería y Voltaje)
     *****************************************************************/
    const ctx = document.getElementById('energyChart').getContext('2d');
    const gradient1 = ctx.createLinearGradient(0,0,0,360);
    gradient1.addColorStop(0, 'rgba(0,188,212,0.28)');
    gradient1.addColorStop(1, 'rgba(91,108,255,0.06)');

    const gradient2 = ctx.createLinearGradient(0,0,0,360);
    gradient2.addColorStop(0, 'rgba(255,193,7,0.2)');
    gradient2.addColorStop(1, 'rgba(255,152,0,0.05)');

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'Batería (%)',
            data: batteryData,
            borderColor: '#00bcd4',
            backgroundColor: gradient1,
            tension: 0.28,
            pointRadius: 2,
            pointBackgroundColor: '#eaffff',
            borderWidth: 2.5,
            fill: true,
            yAxisID: 'y'
          },
          {
            label: 'Voltaje (V)',
            data: voltageData,
            borderColor: '#ffc107',
            backgroundColor: gradient2,
            tension: 0.28,
            pointRadius: 2,
            pointBackgroundColor: '#ffe082',
            borderWidth: 2.5,
            fill: true,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: 'rgba(230,246,255,0.9)' } },
          tooltip: {
            backgroundColor: '#04212b',
            titleColor: '#eaffff',
            bodyColor: '#cfeefb',
            cornerRadius: 8
          }
        },
        scales: {
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            title: { display: true, text: 'Batería (%)', color: 'rgba(230,246,255,0.9)' },
            ticks: { color: 'rgba(200,230,255,0.85)' },
            grid: { color: 'rgba(255,255,255,0.03)' },
            min: 0,
            max: 100
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            title: { display: true, text: 'Voltaje (V)', color: 'rgba(230,246,255,0.9)' },
            ticks: { color: 'rgba(255,200,0,0.85)' },
            grid: { drawOnChartArea: false },
            min: 0,
            max: 15
          },
          x: {
            title: { display: true, text: 'Hora', color: 'rgba(230,246,255,0.9)' },
            ticks: { color: 'rgba(200,230,255,0.75)' },
            grid: { color: 'rgba(255,255,255,0.01)' }
          }
        }
      }
    });

    /*****************************************************************
     * Visual battery helpers
     *****************************************************************/
    function colorForPercent(p) {
      if (p >= 60) return ['#00bcd4','#00acc1'];
      if (p >= 30) return ['#5b6cff','#3f4fe6'];
      return ['#7e57c2','#6b3fb8'];
    }

    function updateBatteryVisual() {
      const innerWidth = 110;
      const fillWidth = (innerWidth * Math.max(0, Math.min(100, currentBattery))) / 100;
      batFill.setAttribute('width', fillWidth);

      const grad = document.getElementById('gradFill');
      if (grad) {
        const colors = colorForPercent(currentBattery);
        const stops = grad.querySelectorAll('stop');
        if (stops.length >= 2) {
          stops[0].setAttribute('stop-color', colors[0]);
          stops[1].setAttribute('stop-color', colors[1]);
        }
      }

      batText.textContent = batteryDetected ? Math.round(currentBattery) + '%' : '--%';
      percentLabel.textContent = batteryDetected ? Math.round(currentBattery) + '%' : '--%';
      voltageLabel.textContent = batteryDetected ? currentVoltage.toFixed(2) + ' V' : '-- V';
      batteryValueCard.textContent = batteryDetected ? Math.round(currentBattery) + '%' : '--%';
      voltageValueCard.textContent = batteryDetected ? currentVoltage.toFixed(2) + ' V' : '-- V';
      lastUpdateEl.textContent = batteryDetected ? new Date().toLocaleTimeString() : '—';
    }

    /*****************************************************************
     * Persistencia
     *****************************************************************/
    function maybePersist() {
      if (!persistCb.checked) return;
      try {
        const payload = { labels, batteryData, voltageData, currentBattery, currentVoltage };
        localStorage.setItem('dag_battery_log', JSON.stringify(payload));
      } catch (e) { console.warn('No se pudo persistir historial:', e); }
    }

    function restorePersist() {
      try {
        const raw = localStorage.getItem('dag_battery_log');
        if (!raw) return false;
        const obj = JSON.parse(raw);
        if (obj.labels && obj.batteryData) {
          labels.splice(0, labels.length, ...obj.labels);
          batteryData.splice(0, batteryData.length, ...obj.batteryData);
          voltageData.splice(0, voltageData.length, ...obj.voltageData);
          currentBattery = obj.currentBattery || 0;
          currentVoltage = obj.currentVoltage || 0;
          chart.update();
          updateBatteryVisual();
          return true;
        }
      } catch (e) { console.warn('Error restaurando historial:', e); }
      return false;
    }

    /*****************************************************************
     * Actualizar desde Firebase
     *****************************************************************/
    function updateFromFirebase(data) {
      if (!data) return;

      // Leer batería y voltaje de Firebase
      if (data.bateria != null) {
        currentBattery = Number(data.bateria);
      }

      if (data.voltaje != null) {
        currentVoltage = Number(data.voltaje);
      }

      setBatteryDetected(true);
      consecutiveFailures = 0;

      // Agregar punto al gráfico
      const timeStr = new Date().toLocaleTimeString();
      if (!labels.includes(timeStr) || labels[labels.length - 1] !== timeStr) {
        labels.push(timeStr);
        batteryData.push(currentBattery);
        voltageData.push(currentVoltage);

        // Limitar a 120 puntos en el gráfico
        if (labels.length > 120) {
          labels.shift();
          batteryData.shift();
          voltageData.shift();
        }

        chart.update('none');
        maybePersist();
      }

      updateBatteryVisual();
      evaluateAlerts();
    }

    /*****************************************************************
     * Alertas
     *****************************************************************/
    function evaluateAlerts() {
      if (!batteryDetected) { hideAlert(); return; }
      if (currentBattery < 10) {
        showAlert('CRÍTICO: batería muy baja (' + Math.round(currentBattery) + '%)', 'crit');
      } else if (currentBattery < 20) {
        showAlert('Aviso: batería baja (' + Math.round(currentBattery) + '%)', 'warn');
      } else {
        hideAlert();
      }
    }

    function showAlert(text, type) {
      alertBar.textContent = text;
      alertBar.className = type === 'crit' ? 'crit' : 'warn';
      alertBar.style.display = 'block';
    }

    function hideAlert() {
      alertBar.style.display = 'none';
      alertBar.className = '';
    }

    /*****************************************************************
     * Simulación de datos
     *****************************************************************/
    let simInterval = null;
    let simRunning = false;

    function startSimulation() {
      if (simInterval) clearInterval(simInterval);
      simInterval = setInterval(() => {
        const fakeBattery = Math.max(0, Math.min(100, currentBattery + (Math.random() - 0.5) * 5));
        const fakeVoltage = Math.max(0, Math.min(14, currentVoltage + (Math.random() - 0.5) * 0.5));

        updateFromFirebase({
          bateria: fakeBattery,
          voltaje: fakeVoltage
        });
      }, 1200);
      simRunning = true;
      simulateBtn.textContent = 'Detener simulación';
    }

    function stopSimulation() {
      if (simInterval) clearInterval(simInterval);
      simInterval = null;
      simRunning = false;
      simulateBtn.textContent = 'Simular datos';
    }

    simulateBtn.addEventListener('click', () => {
      if (!batteryDetected) {
        setBatteryDetected(true);
        currentBattery = 75;
        currentVoltage = 12;
        updateBatteryVisual();
      }
      if (simRunning) stopSimulation(); else startSimulation();
    });

    /*****************************************************************
     * Controles
     *****************************************************************/
    let monitoringActive = true;
    let firebaseListener = null;

    function startMonitoring() {
      try {
        const dbRef = ref(database, '/'); // Leer todo

        firebaseListener = onValue(dbRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.val();
            consecutiveFailures = 0;
            updateFromFirebase(data);
          } else {
            consecutiveFailures++;
            if (consecutiveFailures >= 3) {
              setBatteryDetected(false);
            }
          }
        }, (error) => {
          console.error('Error leyendo datos de Firebase:', error);
          consecutiveFailures++;
          if (consecutiveFailures >= 3) {
            setBatteryDetected(false);
          }
        });
      } catch (error) {
        console.error('Error iniciando monitoreo:', error);
        setBatteryDetected(false);
      }
    }

    pauseBtn.addEventListener('click', () => {
      if (!monitoringActive) {
        monitoringActive = true;
        pauseBtn.textContent = 'Pausar monitoreo';
        startMonitoring();
      } else {
        monitoringActive = false;
        pauseBtn.textContent = 'Reanudar monitoreo';
        if (firebaseListener) firebaseListener();
      }
    });

    clearBtn.addEventListener('click', () => {
      labels.length = 0;
      batteryData.length = 0;
      voltageData.length = 0;
      chart.update();
      localStorage.removeItem('dag_battery_log');
    });

    persistCb.addEventListener('change', () => {
      if (persistCb.checked) restorePersist();
      else localStorage.removeItem('dag_battery_log');
    });

    /*****************************************************************
     * Estado de conexión
     *****************************************************************/
    function setBatteryDetected(detected) {
      batteryDetected = !!detected;
      overlay.style.display = batteryDetected ? 'none' : 'flex';
      pauseBtn.disabled = !batteryDetected;

      if (detected) {
        statusDot.classList.add('connected');
        statusDot.classList.remove('error');
        statusText.textContent = '✓ Conectado a Firebase';
      } else {
        statusDot.classList.remove('connected');
        statusDot.classList.add('error');
        statusText.textContent = '✗ Desconectado de Firebase';
      }

      if (!batteryDetected) {
        if (clearOnDisconnectCb.checked) {
          labels.length = 0;
          batteryData.length = 0;
          voltageData.length = 0;
          chart.update();
          localStorage.removeItem('dag_battery_log');
        }
        stopSimulation();
      } else {
        updateBatteryVisual();
        if (persistCb.checked) restorePersist();
      }
    }

    /*****************************************************************
     * Startup
     *****************************************************************/
    function init() {
      setBatteryDetected(false);
      startMonitoring();
    }

    window.addEventListener('beforeunload', () => {
      if (persistCb.checked) maybePersist();
    });

    // Iniciar
    init();

    // Exponer para debug
    window.__dag = { updateFromFirebase, setBatteryDetected, currentBattery, currentVoltage };
  </script>
